name: Build and Publish Monitoring Images to GHCR

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PROMETHEUS: ghcr.io/${{ github.repository_owner }}/fs-prometheus
  IMAGE_GRAFANA: ghcr.io/${{ github.repository_owner }}/fs-grafana
  IMAGE_LOKI: ghcr.io/${{ github.repository_owner }}/fs-loki
  IMAGE_PROMTAIL: ghcr.io/${{ github.repository_owner }}/fs-promtail

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Build & Push Prometheus Image
      - name: Extract metadata for Prometheus
        id: meta-prometheus
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PROMETHEUS }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable=true
            type=raw,value=build-${{ github.run_number }}
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}
            type=ref,event=tag

      - name: Build and push Prometheus image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prometheus
          push: true
          tags: ${{ steps.meta-prometheus.outputs.tags }}
          labels: ${{ steps.meta-prometheus.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Build & Push Grafana Image
      - name: Extract metadata for Grafana
        id: meta-grafana
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_GRAFANA }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable=true
            type=raw,value=build-${{ github.run_number }}
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}
            type=ref,event=tag

      - name: Build and push Grafana image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.grafana
          push: true
          tags: ${{ steps.meta-grafana.outputs.tags }}
          labels: ${{ steps.meta-grafana.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3. Build & Push Loki Image
      - name: Extract metadata for Loki
        id: meta-loki
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_LOKI }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable=true
            type=raw,value=build-${{ github.run_number }}
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}
            type=ref,event=tag

      - name: Build and push Loki image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.loki
          push: true
          tags: ${{ steps.meta-loki.outputs.tags }}
          labels: ${{ steps.meta-loki.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4. Build & Push Promtail Image
      - name: Extract metadata for Promtail
        id: meta-promtail
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PROMTAIL }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable=true
            type=raw,value=build-${{ github.run_number }}
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}
            type=ref,event=tag

      - name: Build and push Promtail image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.promtail
          push: true
          tags: ${{ steps.meta-promtail.outputs.tags }}
          labels: ${{ steps.meta-promtail.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: VPS-Sumopod
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /opt/feryshop
            docker compose -f docker-compose.prod.yml pull prometheus grafana loki promtail
            docker compose -f docker-compose.prod.yml up -d --no-deps prometheus grafana loki promtail
            docker image prune -f
