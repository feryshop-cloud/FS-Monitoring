name: Build and Publish Monitoring Images to GHCR

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PROMETHEUS: ghcr.io/${{ github.repository_owner }}/fs-prometheus
  IMAGE_GRAFANA: ghcr.io/${{ github.repository_owner }}/fs-grafana

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Build & Push Prometheus Image
      - name: Extract metadata for Prometheus
        id: meta-prometheus
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PROMETHEUS }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable=true
            type=ref,event=tag

      - name: Build and push Prometheus image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prometheus
          push: true
          tags: ${{ steps.meta-prometheus.outputs.tags }}
          labels: ${{ steps.meta-prometheus.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Build & Push Grafana Image
      - name: Extract metadata for Grafana
        id: meta-grafana
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_GRAFANA }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable=true
            type=ref,event=tag

      - name: Build and push Grafana image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.grafana
          push: true
          tags: ${{ steps.meta-grafana.outputs.tags }}
          labels: ${{ steps.meta-grafana.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploy ke VPS secara otomatis saat push ke branch main
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        if: github.ref == 'refs/heads/main' && secrets.VPS_HOST != ''
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /opt/feryshop
            docker compose -f docker-compose.prod.yml pull prometheus grafana
            docker compose -f docker-compose.prod.yml up -d --no-deps prometheus grafana
            docker image prune -f
